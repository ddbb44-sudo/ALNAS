<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة سورة الفاتحة تعمل بنجاح</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f5f3ef 0%, #eae4d6 50%, #d6cfc2 100%);
            color: #2d3a32;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            background: #c6a96b;
            top: -150px; right: -150px;
        }
        body::after {
            width: 450px; height: 450px;
            background: #8fae8a;
            bottom: -150px; left: -150px;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 56px 40px;
            text-align: center;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.15), 0 8px 24px -8px rgba(0, 0, 0, 0.05);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(49, 71, 58, 0.08);
            color: #31473a;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .badge .dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: clamp(28px, 5vw, 38px);
            color: #31473a;
            margin-bottom: 28px;
            line-height: 1.8;
        }

        h1 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #5b6b62;
            margin-bottom: 36px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: #31473a;
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 6px 18px -4px rgba(49, 71, 58, 0.4);
        }

        .home-link:hover {
            background: #243429;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -4px rgba(49, 71, 58, 0.5);
        }

        .home-link svg {
            width: 16px; height: 16px;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #94a39a;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">
            <span class="dot"></span>
            الصفحة تعمل بنجاح
        </span>

        <div class="bismillah">﴿ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴾</div>

        <h1>صفحة سورة الفاتحة تعمل بنجاح</h1>
        <p>
            هذه صفحة تجريبية للتأكد من أن الرابط يعمل بشكل صحيح عبر GitHub Pages.
            المحتوى الكامل سيُضاف لاحقاً بإذن الله.
        </p>

        <a href="../" class="home-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            العودة إلى الصفحة الرئيسية
        </a>

        <div class="footer">ALNAS · /fatiha</div>
    </main>
</body>
</html>
